<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moodie</title>
<link rel="preload" href="/fonts/outfit-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Outfit";src:url("/fonts/outfit-latin-variable.woff2") format("woff2");font-style:normal;font-weight:400 800;font-display:swap}
:root{--bg:#f4f4f6;--surface:#fff;--surface2:#ececf0;--text:#16161a;--muted:#65656f;--accent:#e50914;--line:#d8d8de;
--joy:#f5b301;--sadness:#3b82f6;--fear:#8b5cf6;--anger:#ef4444;--surprise:#14b8a6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d10;--surface:#18181d;--surface2:#24242b;--text:#f3f3f5;--muted:#9a9aa6;--line:#2f2f38;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0d10;--surface:#18181d;--surface2:#24242b;--text:#f3f3f5;--muted:#9a9aa6;--line:#2f2f38;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45;font-optical-sizing:auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;gap:16px;padding:14px 4vw;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:24px;letter-spacing:-.5px;color:var(--accent)}
.hero{padding:7vw 4vw 4vw;background:#1f2a51;color:#fff;text-align:center}
.hero h1{font-size:clamp(28px,5vw,52px);font-weight:700;line-height:1.08;margin:0 auto 10px;letter-spacing:-.02em;max-width:14em;text-wrap:balance}
.hero p{margin:0;color:var(--muted);max-width:40em;font-size:clamp(14px,1.6vw,18px)}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;margin-top:18px;font-size:13px;color:var(--muted)}
.hero .legend{color:#fae8e9}
.hero .emotion-filter label{color:#fff;font-size:13px;font-weight:600}
.search-controls{display:flex;align-items:stretch;gap:12px;width:min(100%,820px);margin:28px auto 0;text-align:left}
.search-wrap{display:flex;flex:1;min-width:0}
.search{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);color:var(--text);padding:11px 14px;border-radius:8px;font:inherit}
.emotion-filter{display:grid;grid-template-columns:auto minmax(115px,1fr);align-items:center;gap:4px 10px;width:min(100%,340px);padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.emotion-filter label{font-size:12px;color:var(--muted)}
.emotion-filter select{grid-column:2;grid-row:1;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.emotion-filter .threshold-label{grid-column:1;grid-row:2;white-space:nowrap}
.emotion-filter output{color:var(--text);font-variant-numeric:tabular-nums}
.emotion-filter input{grid-column:2;grid-row:2;width:100%;accent-color:var(--accent)}
.emotion-filter input:disabled{opacity:.5}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.chips{display:flex;justify-content:center;gap:8px;padding:0 4vw 18px;overflow-x:auto}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:7px 14px;border-radius:99px;cursor:pointer;font:inherit;font-size:13px}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:18px;padding:0 4vw 60px;align-items:start}
.card{background:var(--surface);border-radius:12px;overflow:hidden;border:1px solid var(--line);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.25)}
.poster{height:130px;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;position:relative}
.poster.with-poster{height:220px;display:grid;grid-template-columns:minmax(105px,145px) minmax(0,1fr);padding:0}
.poster-art-link{display:block;height:100%;overflow:hidden;background:#1a1a22}
.poster-art{display:block;width:100%;height:100%;object-fit:cover;object-position:center top}
.poster-copy{display:flex;min-width:0;flex-direction:column;justify-content:flex-end;padding:14px}
.poster-source{margin-top:5px;color:rgba(255,255,255,.82);font-size:11px;text-decoration:underline;text-underline-offset:2px}
.poster-source:hover{color:#fff}
.poster h3{margin:0;font-size:20px;letter-spacing:-.3px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.poster small{opacity:.9;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.badge{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.45);padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600}
.body{padding:14px}
.stack{display:flex;height:8px;border-radius:99px;overflow:hidden;margin-bottom:12px;background:var(--surface2)}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.row{display:flex;align-items:center;gap:8px;font-size:13px}
.row b{margin-left:auto;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px}.btn{margin-top:14px;flex:1;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.graph{display:none;margin-top:12px}
.card.open .graph{display:block}.graph2{display:none;margin-top:12px}.card.open2 .graph2{display:block}
.tog{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tog button{font:inherit;font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid var(--c);background:transparent;color:var(--text);cursor:pointer}
.tog button.on{background:var(--c);color:#fff}
svg{width:100%;height:auto;display:block;touch-action:none}
.read{font-size:12px;color:var(--muted);min-height:18px;margin-top:4px}
.empty{padding:40px 4vw;color:var(--muted)}
footer{padding:20px 4vw 40px;color:var(--muted);font-size:12px}
@media(max-width:600px){.hero{padding:12vw 5vw 8vw}.search-controls{flex-direction:column;gap:10px;margin-top:22px}.emotion-filter{width:100%}.chips{justify-content:center;flex-wrap:wrap;overflow-x:visible}}
@media(max-width:380px){.poster.with-poster{grid-template-columns:112px minmax(0,1fr)}.poster-copy{padding:12px}.poster h3{font-size:18px}}
</style>
</head>
<body>
<header><div class="logo">MOODIE</div></header>
<section class="hero">
<h1>What are you in the mood to feel?</h1>
<div class="search-controls">
<label class="search-wrap"><span class="sr-only">Search films</span><input class="search" id="q" placeholder="Search films…" aria-label="Search films"></label>
<div class="emotion-filter">
<label for="emotion">Emotion</label><select id="emotion" aria-label="Choose an emotion"><option value="">Any emotion</option></select>
<label class="threshold-label" for="threshold">At least <output id="threshold-value" for="threshold">20%</output></label><input id="threshold" type="range" min="0" max="100" step="5" value="20" aria-label="Minimum emotion percentage" disabled>
</div>
</div>
<div class="legend" id="legend"></div>
</section>
<div class="chips" id="chips"></div>
<main class="grid" id="grid" aria-live="polite"></main>
<footer>Emotion values and mood charts are scored from each film’s subtitles and loaded from the Moodie database.</footer>

<script>
const EM=[["joy","Joy"],["sadness","Sadness"],["fear","Fear"],["anger","Anger"],["surprise","Surprise"]];
const COL=Object.fromEntries(EM.map(([k])=>[k,getComputedStyle(document.documentElement).getPropertyValue("--"+k).trim()]));
const $=s=>document.querySelector(s);
$("#legend").innerHTML=EM.map(([k,l])=>`<span><i class="dot" style="background:${COL[k]}"></i>${l}</span>`).join("");
$("#emotion").innerHTML+=EM.map(([k,l])=>`<option value="${k}">${l}</option>`).join("");
let films=[],filmsLoaded=false,loadError="",filter="all",query="",selectedEmotion="",minEmotion=20;
$("#chips").innerHTML=[["all","All"],...EM].map(([k,l])=>`<button class="chip${k==="all"?" on":""}" data-k="${k}">${k==="all"?l:"Most "+l.toLowerCase()}</button>`).join("");
$("#chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;filter=b.dataset.k;document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===b));render()};
$("#q").oninput=e=>{query=e.target.value.toLowerCase();render()};
$("#emotion").onchange=e=>{selectedEmotion=e.target.value;$("#threshold").disabled=!selectedEmotion;render()};
$("#threshold").oninput=e=>{minEmotion=Number(e.target.value);$("#threshold-value").textContent=`${minEmotion}%`;render()};
function escapeHTML(value){return String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
async function loadFilms(){
 const grid=$("#grid");
 try{
  const response=await fetch("/api/films");
  if(!response.ok)throw new Error(`Server returned HTTP ${response.status}`);
  const rows=await response.json();
  if(!Array.isArray(rows))throw new Error("Unexpected movie data response");
  films=rows.map(row=>{
   const w=Object.fromEntries(EM.map(([key])=>[key,Number(row.emotions[key])]));
   const total=Object.values(w).reduce((sum,value)=>sum+value,0);
   const pct=Object.fromEntries(EM.map(([key])=>[key,total?w[key]/total*100:0]));
   return {id:row.id,t:row.title,y:row.year,m:row.runtime_min,g:row.genre||"Unknown genre",w,pct,top:EM.map(([key])=>key).sort((a,b)=>pct[b]-pct[a])[0],poster:row.poster,pts:null,pointsRequest:null};
  });
  filmsLoaded=true;
  render();
 }catch(error){
  loadError="Could not load movies from the database. Start the local Moodie server and check its database configuration.";
  console.error("Movie data request failed:",error);
  grid.innerHTML=`<div class="empty" role="alert">${escapeHTML(loadError)}</div>`;
 }
}
async function loadPoints(film){
 if(film.pts)return film.pts;
 if(!film.pointsRequest)film.pointsRequest=(async()=>{
  const response=await fetch(`/api/films/${encodeURIComponent(film.id)}/points`);
  if(!response.ok)throw new Error(`Server returned HTTP ${response.status}`);
  const rows=await response.json();
  if(!Array.isArray(rows))throw new Error("Unexpected emotion data response");
  film.pts=rows.map(row=>{
   const minute=Number(row.minute);
   return {minute,x:film.m>0?minute/film.m:0,...Object.fromEntries(EM.map(([key])=>[key,Number(row[key])])),val:Number(row.valence)};
  });
  if(!film.pts.length)throw new Error("No emotion points are available for this movie");
  return film.pts;
 })();
 try{return await film.pointsRequest}
 finally{film.pointsRequest=null}
}

function chart(f,card){
 const W=320,H=170,L=26,B=22,T=8,R=6,on=card._on,sv=card.querySelector("svg");
 const X=x=>L+x*(W-L-R),Y=v=>T+(1-v)*(H-T-B);
 let s=[0,.25,.5,.75,1].map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-4}" y="${Y(v)+3}" text-anchor="end" font-size="8" fill="var(--muted)">${Math.round(v*100)}</text>`).join("");
 [0,.25,.5,.75,1].forEach(x=>s+=`<text x="${X(x)}" y="${H-6}" text-anchor="middle" font-size="8" fill="var(--muted)">${Math.round(x*f.m)}m</text>`);
 EM.forEach(([k])=>{if(!on.has(k))return;s+=`<path d="${f.pts.map((p,i)=>(i?"L":"M")+X(p.x).toFixed(1)+" "+Y(p[k]).toFixed(1)).join("")}" fill="none" stroke="${COL[k]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`});
 s+=`<line class="cur" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="3 3" opacity="0"/>`;
 sv.innerHTML=s;sv.setAttribute("viewBox",`0 0 ${W} ${H}`);
}
function bind(f,card){
 const sv=card.querySelector("svg"),rd=card.querySelector(".read");
 const move=e=>{const r=sv.getBoundingClientRect(),cx=(e.touches?e.touches[0].clientX:e.clientX);
  const x=Math.max(0,Math.min(1,((cx-r.left)/r.width*320-26)/288)),p=f.pts.reduce((best,point)=>Math.abs(point.x-x)<Math.abs(best.x-x)?point:best),c=sv.querySelector(".cur");
  c.setAttribute("x1",26+x*288);c.setAttribute("x2",26+x*288);c.setAttribute("opacity",1);
  rd.innerHTML=`<b style="color:var(--text)">${Math.round(p.minute)} min</b> · `+EM.filter(([k])=>card._on.has(k)).map(([k])=>`<span style="color:${COL[k]}">${Math.round(p[k]*100)}</span>`).join(" · ")};
 sv.onmousemove=move;sv.ontouchmove=move;sv.onmouseleave=()=>{sv.querySelector(".cur").setAttribute("opacity",0);rd.textContent="Hover the graph to read values"};
}
function vchart(f,c){
 const sv=c.querySelector(".vs"),W=320,H=180,L=30,B=22,T=8,R=6,X=x=>L+x*(W-L-R),Y=v=>T+(1-(v+1)/2)*(H-T-B),z=Y(0);
 const ln=f.pts.map((p,i)=>(i?"L":"M")+X(p.x).toFixed(1)+" "+Y(p.val).toFixed(1)).join("");
 const area=ln+`L${X(1)} ${z}L${X(0)} ${z}Z`;
 let s=`<defs><clipPath id="up${f.id}"><rect x="${L}" y="${T}" width="${W-L-R}" height="${z-T}"/></clipPath><clipPath id="dn${f.id}"><rect x="${L}" y="${z}" width="${W-L-R}" height="${H-B-z}"/></clipPath></defs>`;
 [-1,-.5,0,.5,1].forEach(v=>s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v?"var(--line)":"var(--muted)"}" stroke-width="1"/><text x="${L-4}" y="${Y(v)+3}" text-anchor="end" font-size="8" fill="var(--muted)">${v===1?"Warm":v===-1?"Dark":v===0?"Mid":""}</text>`);
 [0,.25,.5,.75,1].forEach(x=>s+=`<text x="${X(x)}" y="${H-6}" text-anchor="middle" font-size="8" fill="var(--muted)">${Math.round(x*f.m)}m</text>`);
 s+=`<path d="${area}" fill="#ff9f1c" opacity=".55" clip-path="url(#up${f.id})"/><path d="${area}" fill="#5b4bdb" opacity=".55" clip-path="url(#dn${f.id})"/><path d="${ln}" fill="none" stroke="var(--text)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
 s+=`<text x="${L+4}" y="${T+9}" font-size="8" fill="#ff9f1c" font-weight="700">WARM</text><text x="${L+4}" y="${H-B-4}" font-size="8" fill="#7c6cff" font-weight="700">DARK</text>`;
 s+=`<line class="cur" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="3 3" opacity="0"/>`;
 sv.innerHTML=s;sv.setAttribute("viewBox",`0 0 ${W} ${H}`);
}
function bindV(f,c){
 const sv=c.querySelector(".vs"),rd=c.querySelector(".read2");
 const move=e=>{const r=sv.getBoundingClientRect(),cx=(e.touches?e.touches[0].clientX:e.clientX);
  const x=Math.max(0,Math.min(1,((cx-r.left)/r.width*320-30)/284)),p=f.pts.reduce((best,point)=>Math.abs(point.x-x)<Math.abs(best.x-x)?point:best),cu=sv.querySelector(".cur");
  cu.setAttribute("x1",30+x*284);cu.setAttribute("x2",30+x*284);cu.setAttribute("opacity",1);
  const pos=p.val>=0;rd.innerHTML=`<b style="color:var(--text)">${Math.round(p.minute)} min</b> · <span style="color:${pos?"#ff9f1c":"#7c6cff"}">${Math.abs(p.val)<.1?"Neutral":pos?"Warm":"Dark"} (${pos?"+":""}${p.val.toFixed(2)})</span>`};
 sv.onmousemove=move;sv.ontouchmove=move;sv.onmouseleave=()=>{sv.querySelector(".cur").setAttribute("opacity",0);rd.textContent="Hover to see sentiment"};
}
function render(){
 const g=$("#grid");
 if(loadError){g.innerHTML=`<div class="empty" role="alert">${escapeHTML(loadError)}</div>`;return}
 if(!filmsLoaded){g.innerHTML=`<div class="empty" role="status">Loading movies from the database…</div>`;return}
 const list=films.filter(f=>(f.t.toLowerCase().includes(query)||f.g.toLowerCase().includes(query))&&(!selectedEmotion||Math.round(f.pct[selectedEmotion])>=minEmotion)).sort((a,b)=>filter==="all"?a.t.localeCompare(b.t):b.pct[filter]-a.pct[filter]);
 g.innerHTML=list.length?"":`<div class="empty">${films.length?"No films match these filters.":"No scored movies are in the database yet. Add a film and its subtitle emotion scores, then reload."}</div>`;
 list.forEach(f=>{
  const c=document.createElement("article");c.className="card";c._on=new Set(EM.map(e=>e[0]));
  const sorted=EM.slice().sort((a,b)=>f.pct[b[0]]-f.pct[a[0]]);
  const posterStyle=`background:linear-gradient(160deg,${COL[f.top]},#1a1a22 85%)`;
  const posterCredit=f.poster?.source_url&&f.poster?.source_name?`<a class="poster-source" href="${escapeHTML(f.poster.source_url)}" target="_blank" rel="noopener noreferrer">Poster: ${escapeHTML(f.poster.source_name)}</a>`:"";
  const posterMarkup=f.poster?`<img class="poster-art" src="${escapeHTML(f.poster.url)}" alt="Poster for ${escapeHTML(f.t)}" loading="lazy" decoding="async" referrerpolicy="no-referrer">`:"";
  const posterArt=f.poster?(f.poster.source_url?`<a class="poster-art-link" href="${escapeHTML(f.poster.source_url)}" target="_blank" rel="noopener noreferrer" aria-label="View poster source for ${escapeHTML(f.t)}">${posterMarkup}</a>`:`<div class="poster-art-link">${posterMarkup}</div>`):"";
  const posterHeader=f.poster?`<div class="poster with-poster" style="${posterStyle}">${posterArt}<div class="poster-copy"><span class="badge">Mostly ${f.top}</span><h3>${escapeHTML(f.t)}</h3><small>${escapeHTML(f.y??"Year unknown")} · ${escapeHTML(f.g)} · ${Math.floor(f.m/60)}h ${f.m%60}m</small>${posterCredit}</div></div>`:`<div class="poster" style="${posterStyle}"><span class="badge">Mostly ${f.top}</span><h3>${escapeHTML(f.t)}</h3><small>${escapeHTML(f.y??"Year unknown")} · ${escapeHTML(f.g)} · ${Math.floor(f.m/60)}h ${f.m%60}m</small></div>`;
  c.innerHTML=`${posterHeader}
  <div class="body"><div class="stack">${sorted.map(([k])=>`<div style="width:${f.pct[k]}%;background:${COL[k]}"></div>`).join("")}</div>
  <div class="rows">${EM.map(([k,l])=>`<div class="row"><i class="dot" style="background:${COL[k]};margin:0"></i>${l}<b>${Math.round(f.pct[k])}%</b></div>`).join("")}</div>
  <div class="btns"><button class="btn" aria-expanded="false">Show emotion graph</button><button class="btn btn2" aria-expanded="false">Show moodline</button></div>
  <div class="graph"><div class="tog">${EM.map(([k,l])=>`<button class="on" style="--c:${COL[k]}" data-k="${k}">${l}</button>`).join("")}</div><svg role="img" aria-label="Emotions over time for ${escapeHTML(f.t)}"></svg><div class="read">Hover the graph to read values</div></div><div class="graph2"><svg class="vs" role="img" aria-label="Moodline, warm versus dark, over time for ${escapeHTML(f.t)}"></svg><div class="read read2">Hover to see sentiment</div></div></div>`;
  const posterElement=c.querySelector(".poster-art");
  if(posterElement)posterElement.onerror=()=>{c.querySelector(".poster.with-poster").classList.remove("with-poster");posterElement.closest(".poster-art-link").remove();c.querySelector(".poster-copy").classList.remove("poster-copy");const source=c.querySelector(".poster-source");if(source)source.remove()};
  const btn=c.querySelector(".btn");
  btn.onclick=async()=>{const o=c.classList.toggle("open");btn.textContent=o?"Hide emotion graph":"Show emotion graph";btn.setAttribute("aria-expanded",o);if(o){const read=c.querySelector(".read");read.textContent="Loading emotion data…";try{await loadPoints(f);if(c.isConnected&&c.classList.contains("open")){chart(f,c);read.textContent="Hover the graph to read values"}}catch(error){console.error(`Could not load emotion data for movie ${f.id}:`,error);read.textContent="Could not load this movie’s emotion data. Try again."}}};
  c.querySelector(".tog").onclick=e=>{const b=e.target.closest("button");if(!b)return;const k=b.dataset.k;c._on.has(k)?c._on.delete(k):c._on.add(k);b.classList.toggle("on");chart(f,c)};
  const b2=c.querySelector(".btn2");
  b2.onclick=async()=>{const o=c.classList.toggle("open2");b2.textContent=o?"Hide moodline":"Show moodline";b2.setAttribute("aria-expanded",o);if(o){const read=c.querySelector(".read2");read.textContent="Loading emotion data…";try{await loadPoints(f);if(c.isConnected&&c.classList.contains("open2")){vchart(f,c);read.textContent="Hover to see sentiment"}}catch(error){console.error(`Could not load moodline data for movie ${f.id}:`,error);read.textContent="Could not load this movie’s moodline. Try again."}}};
  bindV(f,c);bind(f,c);g.appendChild(c)});
}
render();
loadFilms();
</script>
</body>
</html>
